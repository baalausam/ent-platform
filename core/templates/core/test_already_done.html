{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Тест тапсырылды" %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f4f6f8; color: #2c3e50;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: #fff; border: 1px solid #e5e9ee;
            border-radius: 24px; padding: 48px 40px;
            max-width: 500px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .icon { font-size: 72px; margin-bottom: 20px; }
        h1 {
            font-size: 28px; font-weight: 900;
            color: #059669; margin-bottom: 12px;
        }
        p {
            color: #64748b; font-size: 15px;
            line-height: 1.7; margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white; text-decoration: none;
            border-radius: 12px; font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>{% trans "Сіз бұл сессияны тапсырдыңыз" %}</h1>
        <p>
            {% trans "Бір сессияда тек бір рет тест тапсыруға рұқсат етіледі. Жаңа сессия ашылғанша күтіңіз." %}
        </p>
        <a href="{% url 'core:student_dashboard' %}" class="btn">
            ← {% trans "Артқа" %}
        </a>
    </div>
</body>
</html>
